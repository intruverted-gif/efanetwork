kind = "web"
previewPath = "/"
title = "AFL Site"
version = "1.0.0"
id = "artifacts/afl-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21726

[services.development]
run = "pnpm --filter @workspace/afl-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/afl-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/afl-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21726"
BASE_PATH = "/"
